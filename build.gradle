plugins {
    id 'net.fabricmc.fabric-loom-remap' version loom_version
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java { withSourcesJar(); toolchain.languageVersion = JavaLanguageVersion.of(21) }

jar { from('LICENSE') { rename { 'LICENSE_FROSTSCAN' } } }

publishing {
    publications { mavenJava(MavenPublication) { from components.java } }
    repositories { maven { name = 'localBuild'; url = layout.buildDirectory.dir('repo') } }
}


tasks.test { useJUnitPlatform() }
